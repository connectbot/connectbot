name: CI Build

on:
  workflow_call:
    secrets:
      GRADLE_CACHE_ENCRYPTION_KEY:
        required: false

jobs:
  verify:
    name: Checks and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout (with history)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          dependency-graph: generate-and-submit
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Delete old Android SDK cmdline-tools
        run: |
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Run checks and unit coverage
        # Aggregate Kover verification has no rules but compiles both release variants.
        run: ./gradlew --profile :ctap2:build :ctap2:koverXmlReport :ctap2-android:assembleRelease :ctap2-android:testDebugUnitTest :ctap2-android:lint check koverXmlReportOssDebug koverXmlReportGoogleDebug :app:stageSonarClasses :ctap2:stageSonarClasses :ctap2-android:stageSonarClasses :app:stageSonarLibraries -x :app:koverVerify

      - name: Check CI helper scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Store Gradle profile
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gradle-profile-verify
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14

      - name: Store unit test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect SonarQube inputs
        run: |
          mkdir -p sonar-inputs/classes
          cp -R app/build/sonar-classes/. sonar-inputs/classes/
          for module in ctap2 ctap2-android; do
            cp -R "$module/build/sonar-classes/." sonar-inputs/classes/
          done
          mkdir -p sonar-inputs/libraries
          cp -R app/build/sonar-libraries/. sonar-inputs/libraries/
          mkdir -p sonar-inputs/reports/kover
          cp ctap2/build/reports/kover/report.xml sonar-inputs/reports/kover/ctap2.xml
          for variant in OssDebug GoogleDebug; do
            report="app/build/reports/kover/report${variant}.xml"
            test -s "$report"
            cp "$report" sonar-inputs/reports/kover/
          done

      - name: Store SonarQube inputs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sonar-verify-${{ github.run_attempt }}
          path: sonar-inputs/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - flavor: oss
            task: Oss
          - flavor: google
            task: Google

    steps:
      - name: Checkout (with history)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-disabled: true

      # Keep the wrapper distribution available when services.gradle.org is down.
      # An exact key ties the installed Gradle binaries to the pinned URL and checksum.
      - name: Cache Gradle distribution
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            !~/.gradle/wrapper/dists/**/*.lck
            !~/.gradle/wrapper/dists/**/*.part
          key: gradle-wrapper-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # Cache downloaded dependencies only; never restore compiled project code or resolution state.
      # Refresh dependency resolution against repository-published checksums below.
      - name: Cache verified dependency downloads
        uses: actions/cache@v6.1.0
        with:
          path: ~/.gradle/caches/modules-2/files-2.1
          key: gradle-downloads-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-downloads-${{ runner.os }}-

      - name: Verify downloaded cache contents
        run: python3 .github/scripts/verify_gradle_download_cache.py "$HOME/.gradle/caches/modules-2/files-2.1"

      - name: Delete old Android SDK cmdline-tools
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Build release APK and bundle
        env:
          FLAVOR_TASK: ${{ matrix.task }}
          IS_PUSH: ${{ (github.event_name == 'push') }}
        run: |
          tasks=(":app:assemble${FLAVOR_TASK}Release")
          if [[ "$IS_PUSH" == 'true' ]]; then
            tasks+=(":app:bundle${FLAVOR_TASK}Release")
          fi
          ./gradlew --refresh-dependencies --no-build-cache --no-configuration-cache --profile "${tasks[@]}"

      - name: Store Gradle profile
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gradle-profile-release-${{ matrix.flavor }}
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare stable signing inputs
        if: ${{ github.event_name == 'push' }}
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          mkdir unsigned
          cp "app/build/outputs/apk/${FLAVOR}/release/app-${FLAVOR}-release-unsigned.apk" unsigned/app.apk
          cp "app/build/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab" unsigned/app.aab

      - name: Store immutable unsigned inputs
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unsigned-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: unsigned/
          if-no-files-found: error

      - name: Prepare release support files
        if: ${{ github.event_name == 'push' }}
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          mkdir support
          cp "app/build/outputs/native-debug-symbols/${FLAVOR}Release/native-debug-symbols.zip" support/
          cp "app/build/outputs/mapping/${FLAVOR}Release/mapping.txt" support/

      - name: Record release metadata
        if: ${{ github.event_name == 'push' }}
        uses: kruton/bathysign/bathysign@v0.2.3
        with:
          command: build-info
          out: support
          profile: ${{ matrix.flavor }}
          version-code-file: app/build/outputs/app_versioning/${{ matrix.flavor }}Release/version_code.txt
          version-name-file: app/build/outputs/app_versioning/${{ matrix.flavor }}Release/version_name.txt

      - name: Store immutable release support files
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-support-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: support/
          if-no-files-found: error

  attest-unsigned:
    name: Trusted provenance ${{ matrix.flavor }}
    if: ${{ github.event_name == 'push' }}
    needs: release
    strategy:
      matrix:
        flavor: [oss, google]
    uses: kruton/bathysign/.github/workflows/bathysign-attest.yml@v0.2.3
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      profile: ${{ matrix.flavor }}

  instrumentation:
    name: Instrumentation ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Preserve both flavors' results and diagnostics when one fails.
      fail-fast: false
      matrix:
        include:
          - flavor: oss
            task: Oss
          - flavor: google
            task: Google

    steps:
      - name: Checkout (with history)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Delete old Android SDK cmdline-tools
        run: |
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrument tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          FLAVOR_TASK: ${{ matrix.task }}
        with:
          api-level: 29
          target: default
          arch: x86_64
          disk-size: 2G
          script: bash .github/scripts/run_instrumentation_tests.sh "$FLAVOR_TASK"

      - name: Capture host diagnostics after instrumentation failure
        if: failure()
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          diagnostics="build/instrumentation-diagnostics/$FLAVOR"
          mkdir -p "$diagnostics"
          free -h > "$diagnostics/host-memory.txt" 2>&1 || true
          ps -eo pid,ppid,rss,comm --sort=-rss > "$diagnostics/host-processes.txt" 2>&1 || true
          timeout --kill-after=5s 10s sudo -n dmesg --ctime > "$diagnostics/host-kernel.txt" 2>&1 || true
          # Native emulator crash reports remain available after adb disappears.
          shopt -s nullglob
          for crash in /tmp/android-*/emu-crash-*; do
            cp -a "$crash" "$diagnostics/" || true
          done

      - name: Store instrumentation test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-test-results-${{ matrix.flavor }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            mosh/build/reports/androidTests/connected/
            mosh/build/outputs/androidTest-results/connected/
            build/instrumentation-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Store Gradle profile
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gradle-profile-instrumentation-${{ matrix.flavor }}
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect SonarQube inputs
        env:
          FLAVOR: ${{ matrix.flavor }}
          FLAVOR_TASK: ${{ matrix.task }}
        run: |
          report="app/build/reports/coverage/androidTest/${FLAVOR}/debug/connected/report.xml"
          test -s "$report"
          mkdir -p "sonar-inputs/reports/androidTest/${FLAVOR}"
          cp "$report" "sonar-inputs/reports/androidTest/${FLAVOR}/"
          java="app/build/intermediates/javac/${FLAVOR}DebugAndroidTest/compile${FLAVOR_TASK}DebugAndroidTestJavaWithJavac/classes"
          if [[ -d "$java" ]]; then
            mkdir -p "sonar-inputs/classes/test/${FLAVOR}Debug/androidTest"
            rsync -a --include='*/' --include='*.class' --exclude='*' \
              "$java/" "sonar-inputs/classes/test/${FLAVOR}Debug/androidTest/"
          fi

      - name: Store SonarQube inputs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sonar-instrumentation-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: sonar-inputs/
          if-no-files-found: error
          retention-days: 7

  analysis-inputs:
    name: Assemble isolated analysis inputs
    runs-on: ubuntu-latest
    needs: [verify, instrumentation]
    permissions:
      actions: read
      contents: read
    steps:
      # Only data crosses into the authenticated workflow; never execute these inputs.
      - name: Download SonarQube inputs
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: sonar-*-${{ github.run_attempt }}
          merge-multiple: true
          path: sonar-inputs

      - name: Store isolated analysis inputs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sonar-inputs-${{ github.run_attempt }}
          path: sonar-inputs/
          if-no-files-found: error
          retention-days: 7

  uuid-migration-min-sdk:
    name: UUID migration API 24
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UUID migration tests on minimum SDK
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 24
          target: default
          arch: x86
          disk-size: 2G
          script: |
            ./gradlew :app:assembleOssDebug :app:assembleOssDebugAndroidTest
            python3 .github/scripts/run_uuid_migration_device_tests.py

      - name: Verify UUID migration tests actually ran
        run: python3 .github/scripts/verify_uuid_migration_results.py app/build/outputs/androidTest-results/connected/debug/flavors/oss

      - name: Store migration test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: uuid-migration-api24
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
