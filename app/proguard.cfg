#-keepattributes SourceFile,LineNumberTable
#-optimizationpasses 5
-dontobfuscate

# App classes
-keep class org.connectbot.**
-keepclassmembers class org.connectbot.R$* {
	public static <fields>;
}
-keepattributes InnerClasses
# All the classes are referenced indirectly.
-keep class org.conscrypt.** { *; }

# Backward compatibility code in Conscrypt
-dontnote libcore.io.Libcore
-dontnote org.apache.harmony.xnet.provider.jsse.OpenSSLRSAPrivateKey
-dontnote org.apache.harmony.security.utils.AlgNameMapper
-dontnote sun.security.x509.AlgorithmId

-dontwarn dalvik.system.BlockGuard
-dontwarn dalvik.system.BlockGuard$Policy
-dontwarn dalvik.system.CloseGuard
-dontwarn com.android.org.conscrypt.OpenSSLSocketImpl
-dontwarn com.android.org.conscrypt.SSLParametersImpl
-dontwarn org.apache.harmony.xnet.provider.jsse.OpenSSLSocketImpl
-dontwarn org.apache.harmony.xnet.provider.jsse.SSLParametersImpl
-dontwarn javax.annotation.Nullable

# Accessed by RsaSignatureAlgorithmPolicy until sshlib exposes an RSA signature preference API.
-keepclassmembers class org.connectbot.sshlib.SshClient {
    private org.connectbot.sshlib.client.SshConnection connection;
}
-keepclassmembers class org.connectbot.sshlib.client.SshConnection {
    private java.util.Set serverSigAlgs;
    public java.lang.Object beginChannelRequest$org_connectbot_sshlib_sshlib(int, java.lang.String, boolean, kotlin.jvm.functions.Function1, kotlin.coroutines.Continuation);
}

# Accessed by SshAgentForwarding until sshlib exposes SshSession.requestAgentForwarding().
-keepclassmembers class org.connectbot.sshlib.client.SessionChannel {
    private final org.connectbot.sshlib.client.SshConnection connection;
    private java.lang.Object performSendRequest(kotlin.jvm.functions.Function1, kotlin.coroutines.Continuation);
}
-keep class org.connectbot.sshlib.protocol.InvalidMessage {
    public <init>();
    public void _check();
}
-keepclassmembers class org.connectbot.sshlib.protocol.SshMsgChannelRequest {
    public void setRequestSpecificFields(io.kaitai.struct.KaitaiStruct$ReadWrite);
}

# SLF4J discovers this provider through META-INF/services.
-keep class org.connectbot.logging.TimberServiceProvider { public <init>(); }
