version: 2
updates:
- package-ecosystem: gradle
  directory: "/"
  schedule:
    interval: daily
  cooldown:
    default-days: 3
    exclude:
      - "org.connectbot.*"
      - "org.connectbot:*"
  open-pull-requests-limit: 10

- package-ecosystem: gradle
  directory: "/translations"
  schedule:
    interval: daily
  open-pull-requests-limit: 10

- package-ecosystem: "github-actions"
  directory: "/" # Location of package manifests
  schedule:
    interval: "weekly"
