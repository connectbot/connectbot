name: Finalize signed Android release
on:
  workflow_run:
    workflows: [Continuous Integration, Continuous Integration (tags)]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful source build run ID
        type: string
        required: true
      source_attempt:
        description: Source build attempt
        type: string
        default: '1'
        required: true
permissions:
  contents: read
jobs:
  dispatch:
    if: ${{ vars.BATHYSIGN_ENABLED == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.id == github.event.repository.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch default-branch finalizer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          body = {"ref": os.environ["DEFAULT_BRANCH"], "inputs": {"source_run": str(int(os.environ["SOURCE_RUN"])), "source_attempt": str(int(os.environ["SOURCE_ATTEMPT"]))}}
          pathlib.Path(os.environ["RUNNER_TEMP"], "finalize.json").write_text(json.dumps(body))
          PY
          gh api --hostname github.com --method POST "repos/$GH_REPO/actions/workflows/signed-release.yml/dispatches" --input "$RUNNER_TEMP/finalize.json"
  finalize:
    if: ${{ vars.BATHYSIGN_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: kruton/bathysign/.github/workflows/bathysign-finalize.yml@v0.2.0
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      source_run: ${{ fromJSON(inputs.source_run) }}
      source_attempt: ${{ fromJSON(inputs.source_attempt) }}
  publish:
    needs: finalize
    uses: kruton/bathysign/.github/workflows/bathysign-publish.yml@v0.2.0
    permissions:
      contents: write
      actions: read
      id-token: write
    with:
      artifact_id: ${{ needs.finalize.outputs.artifact_id }}
      manifest_sha256: ${{ needs.finalize.outputs.manifest_sha256 }}
