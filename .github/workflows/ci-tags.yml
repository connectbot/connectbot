name: Continuous Integration (tags)

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ci-main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-build.yml
    permissions:
      actions: read
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    secrets: inherit
