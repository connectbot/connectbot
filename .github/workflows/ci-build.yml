name: CI Build

on:
  workflow_call:
    secrets:
      GRADLE_CACHE_ENCRYPTION_KEY:
        required: false
      SONAR_TOKEN:
        required: false

jobs:
  check-inputs:
    name: Check workflow inputs
    runs-on: ubuntu-latest
    outputs:
      has-sonar-token: ${{ steps.sonar-token.outputs.defined }}
    steps:
      - id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: "${{ env.SONAR_TOKEN != '' }}"
        run: echo "defined=true" >> "$GITHUB_OUTPUT"

  verify:
    name: Checks and unit tests
    runs-on: ubuntu-latest
    needs: [check-inputs]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout (with history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: generate-and-submit
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Delete old Android SDK cmdline-tools
        run: |
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Run checks and unit coverage
        # Aggregate Kover verification has no rules but compiles both release variants.
        run: ./gradlew --profile check koverXmlReportOssDebug koverXmlReportGoogleDebug -x :app:koverVerify

      - name: Store Gradle profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-profile-verify
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect SonarQube inputs
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        run: |
          tar -cf sonar-verify.tar \
            app/build/reports/kover \
            app/build/reports/lint-results-*.xml \
            app/build/intermediates/classes \
            app/build/intermediates/javac \
            app/build/test-results

      - name: Store SonarQube inputs
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-verify
          path: sonar-verify.tar
          if-no-files-found: error

  release:
    name: Release ${{ matrix.flavor }}
    needs: [check-inputs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - flavor: oss
            task: Oss
          - flavor: google
            task: Google

    steps:
      - name: Checkout (with history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Delete old Android SDK cmdline-tools
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Build release APK and bundle
        env:
          FLAVOR_TASK: ${{ matrix.task }}
          IS_PUSH: ${{ (github.event_name == 'push') }}
        run: |
          tasks=(":app:assemble${FLAVOR_TASK}Release")
          if [[ "$IS_PUSH" == 'true' ]]; then
            tasks+=(":app:bundle${FLAVOR_TASK}Release")
          fi
          ./gradlew --no-build-cache --no-configuration-cache --profile "${tasks[@]}"

      - name: Store Gradle profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-profile-release-${{ matrix.flavor }}
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare stable signing inputs
        if: ${{ github.event_name == 'push' }}
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          mkdir unsigned
          cp "app/build/outputs/apk/${FLAVOR}/release/app-${FLAVOR}-release-unsigned.apk" unsigned/app.apk
          cp "app/build/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab" unsigned/app.aab

      - name: Store immutable unsigned inputs
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: unsigned/
          if-no-files-found: error

      - name: Prepare release support files
        if: ${{ github.event_name == 'push' }}
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          mkdir support
          cp "app/build/outputs/native-debug-symbols/${FLAVOR}Release/native-debug-symbols.zip" support/
          cp "app/build/outputs/mapping/${FLAVOR}Release/mapping.txt" support/

      - name: Record release metadata
        if: ${{ github.event_name == 'push' }}
        uses: connectbot/actions/android-signer@48fc115604ee7428bcd7daf0858e2eabbbfc4e22 # build metadata
        with:
          command: build-info
          out: support
          profile: ${{ matrix.flavor }}
          version-code-file: app/build/outputs/app_versioning/${{ matrix.flavor }}Release/version_code.txt

      - name: Store immutable release support files
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-support-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: support/
          if-no-files-found: error

  attest-unsigned:
    name: Trusted provenance ${{ matrix.flavor }}
    if: ${{ github.event_name == 'push' }}
    needs: release
    strategy:
      matrix:
        flavor: [oss, google]
    uses: connectbot/actions/.github/workflows/android-attest.yml@android-signer-v1
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      profile: ${{ matrix.flavor }}

  instrumentation:
    name: Instrumentation ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    needs: [check-inputs]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - flavor: oss
            task: Oss
          - flavor: google
            task: Google

    steps:
      - name: Checkout (with history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Delete old Android SDK cmdline-tools
        run: |
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrument tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          FLAVOR_TASK: ${{ matrix.task }}
        with:
          api-level: 29
          target: default
          arch: x86_64
          disk-size: 2G
          script: ./gradlew --profile :app:connected${FLAVOR_TASK}DebugAndroidTest :mosh:connected${FLAVOR_TASK}DebugAndroidTest :app:create${FLAVOR_TASK}DebugAndroidTestCoverageReport --continue

      - name: Store instrumentation test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-results-${{ matrix.flavor }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            mosh/build/reports/androidTests/connected/
            mosh/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

      - name: Store Gradle profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-profile-instrumentation-${{ matrix.flavor }}
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect SonarQube inputs
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        env:
          FLAVOR: ${{ matrix.flavor }}
          FLAVOR_TASK: ${{ matrix.task }}
        run: |
          inputs=("app/build/reports/coverage/androidTest/${FLAVOR}/debug/connected")
          if [[ -d "app/build/intermediates/javac/${FLAVOR}DebugAndroidTest" ]]; then
            inputs+=("app/build/intermediates/javac/${FLAVOR}DebugAndroidTest")
          fi
          tar -cf "sonar-instrumentation-${FLAVOR}.tar" "${inputs[@]}"

      - name: Store SonarQube inputs
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-instrumentation-${{ matrix.flavor }}
          path: sonar-instrumentation-${{ matrix.flavor }}.tar
          if-no-files-found: error

  analysis:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: [check-inputs, verify, instrumentation]
    permissions:
      contents: read

    steps:
      - name: Checkout (with history)
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Delete old Android SDK cmdline-tools
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Download SonarQube inputs
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sonar-*
          merge-multiple: true

      - name: Restore SonarQube inputs
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        run: |
          tar -xf sonar-verify.tar
          tar -xf sonar-instrumentation-oss.tar
          tar -xf sonar-instrumentation-google.tar
          test -s app/build/reports/kover/reportOssDebug.xml
          test -s app/build/reports/kover/reportGoogleDebug.xml
          test -s app/build/reports/coverage/androidTest/oss/debug/connected/report.xml
          test -s app/build/reports/coverage/androidTest/google/debug/connected/report.xml

      - name: Run SonarQube analysis
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --profile :app:sonar -Dsonar.projectVersion=${{ github.sha }}

      - name: Store Gradle profile
        if: always() && needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-profile-analysis
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14
